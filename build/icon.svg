<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6bff"/>
      <stop offset="1" stop-color="#0b2a6b"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="1" stop-color="#ffcf3f"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- flashcard -->
  <g filter="url(#s)">
    <rect x="104" y="132" width="304" height="248" rx="28" fill="#f4f7ff"/>
    <rect x="104" y="132" width="304" height="248" rx="28" fill="none" stroke="#d3ddf2" stroke-width="4"/>
    <line x1="104" y1="196" x2="408" y2="196" stroke="#dfe6f6" stroke-width="4"/>
  </g>

  <!-- lightning bolt -->
  <path d="M300 96 L176 288 H248 L212 432 L360 232 H286 Z"
        fill="url(#bolt)" stroke="#e08a00" stroke-width="8" stroke-linejoin="round"/>
</svg>
